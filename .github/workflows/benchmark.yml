name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  MISE_IDIOMATIC_VERSION_FILE_ENABLE_TOOLS: node,pnpm

jobs:
  benchmarks:
    name: Run benchmarks (walltime, memory)
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bomb.sh/web-platform-tests build
      - name: Run benchmarks with CodSpeed
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5
        with:
          mode: walltime,memory
          run: pnpm bench
