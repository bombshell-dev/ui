name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    if: github.repository_owner == 'bombshell-dev'
    uses: bombshell-dev/automation/.github/workflows/publish.yml@main
    secrets: inherit
